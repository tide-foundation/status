name: ORK network status

on:
  schedule:
    - cron: "*/5 * * * *"   # every 5 minutes (GitHub may delay under load)
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write

concurrency:
  group: status
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Probe the ORK network
        run: node scripts/check.mjs
      - name: Commit results
        run: |
          git config user.name "tide-status-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/status.json data/history.json
          if git diff --cached --quiet; then
            echo "no change"
          else
            git commit -m "status: update $(date -u +%FT%TZ)"
            git push
          fi
