<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tide ORK Network Status</title>
<meta name="description" content="Live operational status of the Tide ORK network.">
<style>
  :root{
    --bg:#f4f6f7; --surface:#ffffff; --fg:#0d1a1e; --muted:#5a6a70; --line:#dde4e6;
    --accent:#0b7c84; --ok:#17803d; --ok-bg:#e6f4ea; --warn:#b4650a; --warn-bg:#fbf0e0;
    --bad:#bf3d15; --bad-bg:#fbeae2; --idle:#9aa7ac;
    --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,monospace;
    --sans:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  @media (prefers-color-scheme:dark){:root{
    --bg:#0a1316; --surface:#0f1d21; --fg:#e9eff0; --muted:#95a6ab; --line:#213138;
    --accent:#35bfb2; --ok:#52c97e; --ok-bg:#122a1b; --warn:#e9a23b; --warn-bg:#2c2109;
    --bad:#f0885a; --bad-bg:#2c1710; --idle:#4b5a60; color-scheme:dark;
  }}
  *{box-sizing:border-box} html,body{margin:0}
  body{background:var(--bg);color:var(--fg);font-family:var(--sans);line-height:1.5;
    -webkit-font-smoothing:antialiased;padding:env(safe-area-inset-top,0) 0 0}
  .wrap{max-width:46rem;margin:0 auto;padding:clamp(24px,6vw,56px) clamp(16px,5vw,28px)}
  header{display:flex;align-items:center;justify-content:space-between;gap:1rem;margin-bottom:clamp(28px,6vw,48px)}
  .brand{display:flex;align-items:center;gap:.6rem;font-weight:600;letter-spacing:-.01em}
  .brand .mark{width:.85rem;height:.85rem;border-radius:3px;background:var(--accent);
    box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 18%,transparent)}
  .brand small{display:block;font-weight:400;color:var(--muted);font-size:.72rem;letter-spacing:.02em}
  .livepill{font-family:var(--mono);font-size:.68rem;letter-spacing:.1em;text-transform:uppercase;
    color:var(--muted);display:flex;align-items:center;gap:.45rem}
  .livepill .d{width:.5rem;height:.5rem;border-radius:50%;background:var(--idle)}

  .hero{background:var(--surface);border:1px solid var(--line);border-radius:18px;
    padding:clamp(22px,5vw,34px);box-shadow:0 1px 2px rgba(0,0,0,.04),0 10px 28px rgba(0,0,0,.05)}
  .status-row{display:flex;align-items:center;gap:1rem}
  .dot{width:1.4rem;height:1.4rem;border-radius:50%;flex:none;background:var(--idle);position:relative}
  .dot::after{content:"";position:absolute;inset:-6px;border-radius:50%;border:2px solid currentColor;opacity:.22}
  .s-op{color:var(--ok)} .s-op .dot{background:var(--ok)}
  .s-de{color:var(--warn)} .s-de .dot{background:var(--warn)}
  .s-ma{color:var(--bad)} .s-ma .dot{background:var(--bad)}
  .headline{font-size:clamp(1.5rem,4.6vw,2.1rem);font-weight:600;letter-spacing:-.02em;line-height:1.1}
  .sub{color:var(--muted);margin-top:.9rem;font-size:1rem}
  .sub b{color:var(--fg);font-weight:600;font-family:var(--mono);font-variant-numeric:tabular-nums}

  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:clamp(10px,2.5vw,16px);margin-top:clamp(18px,4vw,24px)}
  @media (max-width:460px){.stats{grid-template-columns:1fr}}
  .stat{border:1px solid var(--line);border-radius:12px;padding:.9rem 1rem;background:var(--surface)}
  .stat .v{font-family:var(--mono);font-size:1.35rem;font-weight:500;font-variant-numeric:tabular-nums}
  .stat .l{color:var(--muted);font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;margin-top:.2rem}

  .hist{margin-top:clamp(26px,6vw,40px)}
  .hist h2{font-size:.78rem;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);
    font-weight:600;margin:0 0 .8rem}
  .bars{display:flex;gap:2px;align-items:stretch;height:44px;overflow:hidden}
  .bars .bar{flex:1 1 0;min-width:2px;border-radius:2px;background:var(--idle)}
  .bars .bar.op{background:var(--ok)} .bars .bar.de{background:var(--warn)}
  .bars .bar.ma{background:var(--bad)} .bars .bar.no{background:var(--line)}
  .histfoot{display:flex;justify-content:space-between;color:var(--muted);font-size:.72rem;
    font-family:var(--mono);margin-top:.55rem}

  footer{margin-top:clamp(30px,6vw,48px);color:var(--muted);font-size:.8rem;
    display:flex;justify-content:space-between;flex-wrap:wrap;gap:.6rem}
  footer a{color:var(--accent)}
  .upd{font-family:var(--mono);font-size:.76rem;color:var(--muted)}
</style>
</head>
<body>
  <div class="wrap">
    <header>
      <div class="brand"><span class="mark"></span><span>Tide<small>Network status</small></span></div>
      <div class="livepill"><span class="d" id="liveDot"></span><span id="liveTxt">live</span></div>
    </header>

    <main class="hero" id="hero">
      <div class="status-row" id="statusRow">
        <span class="dot"></span>
        <div>
          <div class="headline" id="headline">Loading status…</div>
        </div>
      </div>
      <p class="sub" id="sub">Fetching the latest check.</p>

      <div class="stats">
        <div class="stat"><div class="v" id="u24">–</div><div class="l">Uptime · 24h</div></div>
        <div class="stat"><div class="v" id="u7">–</div><div class="l">Uptime · 7d</div></div>
        <div class="stat"><div class="v" id="u90">–</div><div class="l">Uptime · 90d</div></div>
      </div>

      <div class="hist">
        <h2>Last 90 days</h2>
        <div class="bars" id="bars"></div>
        <div class="histfoot"><span>90 days ago</span><span>today</span></div>
      </div>
    </main>

    <footer>
      <span class="upd" id="updated">—</span>
      <span>Tide ORK network · <span id="count">25</span> nodes</span>
    </footer>
  </div>

<script>
  const LABELS = {
    operational: { cls:"s-op", barCls:"op", head:"All systems operational" },
    degraded:    { cls:"s-de", barCls:"de", head:"Degraded performance" },
    major:       { cls:"s-ma", barCls:"ma", head:"Major outage" },
    pending:     { cls:"",     barCls:"no", head:"Awaiting first check" }
  };
  const pct = v => (v==null ? "–" : (v>=99.995 ? "100%" : v.toFixed(v>=99.9?3:2).replace(/0+$/,"").replace(/\.$/,"")+"%"));
  const ago = iso => {
    if(!iso) return "never";
    const s = Math.max(0,(Date.now()-new Date(iso))/1000);
    if(s<90) return Math.round(s)+"s ago";
    if(s<5400) return Math.round(s/60)+"m ago";
    if(s<172800) return Math.round(s/3600)+"h ago";
    return Math.round(s/86400)+"d ago";
  };

  async function load(){
    let st, hist;
    try{
      st = await (await fetch("./data/status.json?"+Date.now())).json();
      hist = await (await fetch("./data/history.json?"+Date.now())).json();
    }catch(e){ document.getElementById("sub").textContent="Status data not available yet."; return; }

    const meta = LABELS[st.status] || LABELS.pending;
    const row = document.getElementById("statusRow");
    row.className = "status-row "+meta.cls;
    document.getElementById("headline").textContent = meta.head;
    document.getElementById("count").textContent = st.total ?? 25;

    if(st.status==="pending"){
      document.getElementById("sub").textContent = "The first scheduled check has not run yet.";
    } else {
      document.getElementById("sub").innerHTML =
        `<b>${st.up}/${st.total}</b> nodes responding` + (st.avgMs!=null ? ` · avg <b>${st.avgMs}ms</b>` : "");
    }
    document.getElementById("u24").textContent = pct(st.uptime24h);
    document.getElementById("u7").textContent  = pct(st.uptime7d);
    document.getElementById("u90").textContent = pct(st.uptime90d);
    document.getElementById("updated").textContent = "Updated "+ago(st.updatedAt);

    const live = document.getElementById("liveDot");
    live.style.background = st.status==="operational" ? "var(--ok)" : st.status==="degraded" ? "var(--warn)" : st.status==="major" ? "var(--bad)" : "var(--idle)";

    // 90-day bars
    const daily = (hist && hist.daily) ? hist.daily.slice(-90) : [];
    const bars = document.getElementById("bars");
    bars.innerHTML = "";
    const pad = 90 - daily.length;
    for(let i=0;i<pad;i++){ const b=document.createElement("span"); b.className="bar no"; bars.appendChild(b); }
    for(const d of daily){
      const b = document.createElement("span");
      const up = d.checks ? d.up/d.checks : 1;
      b.className = "bar " + (up>=0.999 ? "op" : up>=0.95 ? "de" : "ma");
      b.title = d.date + " · " + pct(d.checks ? (d.up/d.checks)*100 : null);
      bars.appendChild(b);
    }
  }
  load();
  setInterval(load, 60000);
</script>
</body>
</html>
